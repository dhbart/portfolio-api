spring:
  application:
    name: portfolio-api
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:portfolio}
    username: ${PGUSER:portfolio}
    password: ${PGPASSWORD:portfolio}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${PORTFOLIO_AI_MODEL:gpt-4o-mini}
          temperature: ${PORTFOLIO_AI_TEMPERATURE:0.2}
          max-tokens: ${PORTFOLIO_AI_MAX_TOKENS:512}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

portfolio:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  ai:
    enabled: ${PORTFOLIO_AI_ENABLED:true}
    model: ${PORTFOLIO_AI_MODEL:gpt-4o-mini}
    temperature: ${PORTFOLIO_AI_TEMPERATURE:0.2}
    max-tokens: ${PORTFOLIO_AI_MAX_TOKENS:512}
    system-prompt: prompts/system.md
  retrieval:
    enabled: ${PORTFOLIO_RETRIEVAL_ENABLED:false}
    vector-store: ${PORTFOLIO_RETRIEVAL_VECTOR_STORE:supabase-pgvector}
    default-top-k: ${PORTFOLIO_RETRIEVAL_DEFAULT_TOP_K:5}
    minimum-score: ${PORTFOLIO_RETRIEVAL_MINIMUM_SCORE:0.7}
