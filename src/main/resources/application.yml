spring:
  application:
    name: portfolio-api
  web:
    resources:
      static-locations: classpath:/static/
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:portfolio}
    username: ${PGUSER:portfolio}
    password: ${PGPASSWORD:portfolio}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${PORTFOLIO_AI_MODEL:gpt-4o-mini}
        temperature: ${PORTFOLIO_AI_TEMPERATURE:0.2}
        max-tokens: ${PORTFOLIO_AI_MAX_TOKENS:512}

assistant:
  ai:
    embedding:
      api-key: ${OPENAI_API_KEY:}
      endpoint: ${OPENAI_EMBEDDINGS_ENDPOINT:https://api.openai.com/v1/embeddings}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      timeout: ${OPENAI_EMBEDDING_TIMEOUT:30s}
      max-attempts: ${OPENAI_EMBEDDING_MAX_ATTEMPTS:3}
      initial-backoff: ${OPENAI_EMBEDDING_INITIAL_BACKOFF:500ms}
    retrieval:
      top-k: ${PORTFOLIO_RETRIEVAL_TOP_K:5}
      max-context-length: ${PORTFOLIO_RETRIEVAL_MAX_CONTEXT_LENGTH:6000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

portfolio:
  rate-limit:
    assistant:
      capacity: ${PORTFOLIO_AI_RATE_LIMIT_CAPACITY:10}
      window: ${PORTFOLIO_AI_RATE_LIMIT_WINDOW:1m}
      retry-after: ${PORTFOLIO_AI_RATE_LIMIT_RETRY_AFTER:60s}
  security:
    admin-api-key: ${PORTFOLIO_ADMIN_API_KEY:}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  ai:
    enabled: ${PORTFOLIO_AI_ENABLED:true}
    model: ${PORTFOLIO_AI_MODEL:gpt-4o-mini}
    temperature: ${PORTFOLIO_AI_TEMPERATURE:0.2}
    max-tokens: ${PORTFOLIO_AI_MAX_TOKENS:512}
    system-prompt: prompts/system.md
    hardening:
      max-message-length: ${PORTFOLIO_AI_MAX_MESSAGE_LENGTH:2000}
      max-prompt-length: ${PORTFOLIO_AI_MAX_PROMPT_LENGTH:12000}
      reject-injection-attempts: ${PORTFOLIO_AI_REJECT_INJECTION_ATTEMPTS:true}
    resilience:
      timeout: ${PORTFOLIO_AI_TIMEOUT:20s}
      retry-attempts: ${PORTFOLIO_AI_RETRY_ATTEMPTS:3}
      initial-backoff: ${PORTFOLIO_AI_INITIAL_BACKOFF:500ms}
      failure-rate-threshold: ${PORTFOLIO_AI_FAILURE_RATE_THRESHOLD:50}
      sliding-window-size: ${PORTFOLIO_AI_SLIDING_WINDOW_SIZE:10}
      bulkhead-max-concurrent-calls: ${PORTFOLIO_AI_BULKHEAD_MAX_CONCURRENT_CALLS:4}
