spring:
  config:
    activate:
      on-profile: dev
  application:
    name: portfolio-api
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:portfolio}
    username: ${PGUSER:portfolio}
    password: ${PGPASSWORD:portfolio}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

portfolio:
  security:
    admin-api-key: ${PORTFOLIO_ADMIN_API_KEY:}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}

assistant:
  ai:
    embedding:
      api-key: ${OPENAI_API_KEY:}
      endpoint: ${OPENAI_EMBEDDINGS_ENDPOINT:https://api.openai.com/v1/embeddings}
      model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      timeout: ${OPENAI_EMBEDDING_TIMEOUT:30s}
      max-attempts: ${OPENAI_EMBEDDING_MAX_ATTEMPTS:3}
      initial-backoff: ${OPENAI_EMBEDDING_INITIAL_BACKOFF:500ms}
